<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <style>
      html,
      body {
        margin: 0;
        background: #06111a;
        color: #f4f8fb;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic",
          "Hiragino Kaku Gothic ProN", sans-serif;
      }
      #loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-size: 15px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="loading">敦丸を読み込み中…</div>
    <script>
      (async () => {
        try {
          const r = await fetch("./index.html.html?v=20260902-1", {
            cache: "no-store",
          });
          if (!r.ok) throw Error();
          let h = await r.text();
          h = h.split("タチウオ F4（指4本）").join("タチウオ F4");
          const p = await fetch("./site-patch.js?v=20260901-7", {
            cache: "no-store",
          }).then((x) => x.text());
          const c = await fetch("./catch-patch.js?v=20260901-2", {
            cache: "no-store",
          }).then((x) => x.text());
          const c905 = await fetch("./catch-20260905-patch.js?v=20260905-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const c419 = await fetch("./catch-20260419-patch.js?v=20260903-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const c412 = await fetch("./catch-20260412-patch.js?v=20260903-5", {
            cache: "no-store",
          }).then((x) => x.text());
          const c412r = await fetch("./catch-20260412-retry.js?v=20260903-2", {
            cache: "no-store",
          }).then((x) => x.text());
          const i = await fetch("./atsumaru-icon-fix.js?v=20260831-7", {
            cache: "no-store",
          }).then((x) => x.text());
          const o = await fetch("./layout-order.js?v=20260901-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const cc = await fetch("./catch-collapse.js?v=20260901-3", {
            cache: "no-store",
          }).then((x) => x.text());
          const cp = await fetch("./captain-photo.js?v=20260831-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const cn = await fetch("./captain-name-patch.js?v=20260902-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const bp = await fetch("./boat-photo-patch.js?v=20260901-3", {
            cache: "no-store",
          }).then((x) => x.text());
          const bk = await fetch("./booking-form.js?v=20260901-4", {
            cache: "no-store",
          }).then((x) => x.text());
          const hc = await fetch("./hero-copy-patch.js?v=20260901-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const mg = await fetch("./memory-gallery-patch.js?v=20260901-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const lb = await fetch("./photo-lightbox.js?v=20260901-1", {
            cache: "no-store",
          }).then((x) => x.text());
          const tl = await fetch("./tide-live.js?v=20260902-5", {
            cache: "no-store",
          }).then((x) => x.text());
          const mm = await fetch("./mobile-menu.js?v=20260902-1", {
            cache: "no-store",
          }).then((x) => x.text());
          h = h.replace(
            "</body>",
            `<script>${p}<\/script><script>${c}<\/script><script>${c905}<\/script><script>${c419}<\/script><script>${c412}<\/script><script>${i}<\/script><script>${o}<\/script><script>${cc}<\/script><script>${cp}<\/script><script>${cn}<\/script><script>${bp}<\/script><script>${bk}<\/script><script>${hc}<\/script><script>${mg}<\/script><script>${lb}<\/script><script>${tl}<\/script><script>${mm}<\/script><script>${c412r}<\/script></body>`,
          );
          document.open();
          document.write(h);
          document.close();
        } catch (e) {
          document.getElementById("loading").textContent =
            "読み込みに失敗しました。再読み込みしてください。";
        }
      })();
    </script>
  </body>
</html>
